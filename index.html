<script>
    // URL Google Apps Script Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtrhQ9QSzggy-aSLhL_iI6hFx12O1V2EzrjSTIg4lsivzkq-iiswcqU9YCuPMe4kYV2g/exec";

    let nasabahList = [];
    let dokumenList = JSON.parse(localStorage.getItem('flatEmasDokumen')) || [];
    let kasTerkumpul = 0;

    setInterval(() => {
        const clockEl = document.getElementById('clock');
        if (clockEl) clockEl.innerText = new Date().toLocaleString('id-ID');
    }, 1000);

    function formatRp(num) { return "Rp " + Number(num).toLocaleString('id-ID'); }
    function tutupModal(id) { document.getElementById(id).style.display = 'none'; }
    function hitungTglBulan(tglStr, bulanKe) { 
        if(!tglStr) return "-";
        let d = new Date(tglStr); 
        d.setMonth(d.getMonth() + bulanKe); 
        return d.toISOString().split('T')[0]; 
    }

    // FUNGSI UTAMA: Ambil Data Dari Google Sheets Cloud
    function muatDataCloud() {
        const statusEl = document.getElementById('statusCloud');
        if (statusEl) {
            statusEl.innerText = "🔄 Memuat Data Cloud...";
            statusEl.style.background = "#f39c12";
        }

        if (!SCRIPT_URL || SCRIPT_URL.includes("GANTI_DENGAN_URL")) {
            alert("URL Apps Script belum dipasang di kode HTML!");
            return;
        }

        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                kasTerkumpul = 0;
                if (Array.isArray(data)) {
                    nasabahList = data.map(row => {
                        let id = row[0];
                        let nama = row[1];
                        let berat = row[2];
                        let total = parseFloat(row[3]) || 0;
                        let dp = parseFloat(row[4]) || 0;
                        let tenor = parseInt(row[5]) || 12;
                        let iuranFlat = parseFloat(row[6]) || 0;
                        let sisa = parseFloat(row[7]) || 0;
                        let tglAwal = row[8] ? new Date(row[8]).toISOString().split('T')[0] : '';

                        let totalTerbayar = (total - dp) - sisa;
                        kasTerkumpul += (dp + totalTerbayar);

                        let jadwal = [];
                        let sisaDana = totalTerbayar;
                        for (let i = 0; i < tenor; i++) {
                            let st = 'Belum Lunas';
                            if (sisaDana >= iuranFlat) {
                                st = 'Lunas';
                                sisaDana -= iuranFlat;
                            }
                            jadwal.push({ bulan: i + 1, tglJatuhTempo: hitungTglBulan(tglAwal, i), nominal: iuranFlat, status: st });
                        }

                        return { id, nama, berat, total, dp, tenor, iuranFlat, sisa, tglAwal, jadwal };
                    });
                }
                if (statusEl) {
                    statusEl.innerText = "⚡ Cloud Connected";
                    statusEl.style.background = "#27ae60";
                }
                tampilkanDashboard();
            })
            .catch(err => {
                console.error("Gagal koneksi cloud:", err);
                if (statusEl) {
                    statusEl.innerText = "❌ Disconnected";
                    statusEl.style.background = "#e74c3c";
                }
            });
    }

    function kirimKeCloud(payload) {
        const statusEl = document.getElementById('statusCloud');
        if (statusEl) {
            statusEl.innerText = "⏳ Menyimpan Ke Cloud...";
            statusEl.style.background = "#3498db";
        }

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            setTimeout(muatDataCloud, 1500);
        }).catch(err => {
            alert("Gagal mengirim ke Google Sheets!");
            console.error(err);
        });
    }

    function tambahNasabah() {
        const nama = document.getElementById('nama').value;
        const berat = document.getElementById('berat').value;
        const total = parseFloat(document.getElementById('total').value);
        const dp = parseFloat(document.getElementById('dp').value) || 0;
        const tenor = parseInt(document.getElementById('tenor').value) || 12;
        const tglAwal = document.getElementById('tglAwal').value;

        if (!nama || !berat || isNaN(total) || !tglAwal) return alert('Mohon lengkapi semua formulir!');

        const sisaAwal = total - dp;
        const iuranFlat = Math.round(sisaAwal / tenor);
        const newId = Date.now();

        const payload = {
            action: "tambah",
            id: newId,
            nama: nama,
            berat: berat,
            total: total,
            dp: dp,
            tenor: tenor,
            iuranFlat: iuranFlat,
            sisa: sisaAwal,
            tglAwal: tglAwal
        };

        document.querySelectorAll('#nama, #berat, #total, #tglAwal').forEach(el => el.value = '');
        document.getElementById('dp').value = '0';

        kirimKeCloud(payload);
    }

    function bayarCicilan() {
        const id = parseInt(document.getElementById('selectNasabah').value);
        const bayar = parseFloat(document.getElementById('bayar').value);
        const nasabah = nasabahList.find(n => n.id === id);

        if (!nasabah || isNaN(bayar) || bayar <= 0) return alert('Pilih peserta dan masukkan nominal iuran!');
        if (bayar > nasabah.sisa) return alert('Nominal pembayaran melebihi sisa tagihan!');

        const sisaBaru = nasabah.sisa - bayar;

        document.getElementById('bayar').value = '';
        kirimKeCloud({ action: "update", id: id, sisaBaru: sisaBaru });
    }

    function hapusNasabah(id) {
        if(!confirm('⚠️ Yakin ingin menghapus peserta ini dari Cloud Google Sheets?')) return;
        kirimKeCloud({ action: "hapus", id: id });
        document.getElementById('boxJadwal').style.display = 'none';
    }

    function unggahDokumen() {
        const id = parseInt(document.getElementById('selectNasabah').value);
        const fileInput = document.getElementById('fileDokumen');
        const nasabah = nasabahList.find(n => n.id === id);

        if (!nasabah || !fileInput.files[0]) return alert('Pilih nama peserta dan berkas!');
        const file = fileInput.files[0];
        if (file.size > 2 * 1024 * 1024) return alert('Ukuran file maksimal 2MB!');

        const reader = new FileReader();
        reader.onload = function(e) {
            dokumenList.unshift({ idDoc: Date.now(), idNasabah: nasabah.id, namaNasabah: nasabah.nama, namaFile: file.name, dataUrl: e.target.result });
            fileInput.value = ''; 
            localStorage.setItem('flatEmasDokumen', JSON.stringify(dokumenList));
            tampilkanDashboard();
            alert('Dokumen berhasil tersimpan di browser!');
        };
        reader.readAsDataURL(file);
    }

    function hapusDokumen(idDoc) {
        if(confirm('Yakin ingin menghapus dokumen ini?')) {
            dokumenList = dokumenList.filter(d => d.idDoc !== idDoc);
            localStorage.setItem('flatEmasDokumen', JSON.stringify(dokumenList));
            tampilkanDashboard();
        }
    }

    function pilihNasabah() {
        const id = parseInt(document.getElementById('selectNasabah').value);
        const infoBox = document.getElementById('infoIuranBox');
        const nasabah = nasabahList.find(n => n.id === id);

        if (nasabah) {
            infoBox.style.display = 'block';
            document.getElementById('lblTenorAktif').innerText = (nasabah.tenor || 12) + " Bln";
            document.getElementById('lblIuranFlat').innerText = formatRp(nasabah.iuranFlat);
            document.getElementById('bayar').value = nasabah.iuranFlat;
            lihatJadwal(id);
        } else {
            infoBox.style.display = 'none'; 
            document.getElementById('boxJadwal').style.display = 'none';
        }
    }

    function lihatJadwal(id) {
        const nasabah = nasabahList.find(n => n.id === id);
        if (!nasabah) return;
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('boxJadwal').style.display = 'block';
        document.getElementById('judulJadwal').innerText = `📅 Rincian ${nasabah.tenor || 12} Bulan Iuran Kedepan - ${nasabah.nama}`;

        document.getElementById('tabelJadwal').innerHTML = nasabah.jadwal.map(j => {
            let badge = j.status === 'Lunas' ? '<span class="badge badge-lunas">LUNAS</span>' : (j.tglJatuhTempo < today ? '<span class="badge badge-jt">JATUH TEMPO</span>' : '<span class="badge badge-mencicil">BELUM DIBAYAR</span>');
            return `<tr><td>Bulan Ke-${j.bulan}</td><td>${j.tglJatuhTempo}</td><td>${formatRp(j.nominal)}</td><td>${badge}</td></tr>`;
        }).join('');
    }

    function tampilkanDashboard() {
        const today = new Date().toISOString().split('T')[0];
        let totalPiutang = 0; let menunggakCount = 0;

        const sel = document.getElementById('selectNasabah');
        const selectedVal = sel.value;
        sel.innerHTML = '<option value="">-- Pilih Peserta --</option>';

        document.getElementById('tabelNasabah').innerHTML = nasabahList.map(n => {
            totalPiutang += n.sisa;
            sel.innerHTML += `<option value="${n.id}" ${parseInt(selectedVal) === n.id ? 'selected' : ''}>${n.nama}</option>`;

            let tenor = n.tenor || 12;
            let bulanLunasCount = n.jadwal.filter(j => j.status === 'Lunas').length;
            if (n.jadwal.some(j => j.status === 'Belum Lunas' && j.tglJatuhTempo < today)) menunggakCount++;

            return `<tr>
                <td>${n.id}</td><td><b>${n.nama}</b></td><td>${n.berat} g</td><td>${formatRp(n.total)}</td>
                <td>${formatRp(n.dp)}</td><td><b>${tenor} Bln</b></td><td><b style="color:#d4af37;">${formatRp(n.iuranFlat)}</b></td>
                <td>${formatRp(n.sisa)}</td><td><b>${bulanLunasCount}/${tenor} Bln</b></td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-sm" onclick="lihatJadwal(${n.id})">👁️ Jadwal</button>
                        <button class="btn-sm btn-del" onclick="hapusNasabah(${n.id})">🗑️ Hapus</button>
                    </div>
                </td>
            </tr>`;
        }).join('');

        document.getElementById('tabelDokumen').innerHTML = dokumenList.map(d => 
            `<tr>
                <td><b>${d.namaNasabah}</b></td>
                <td>${d.namaFile}</td>
                <td>
                    <div class="action-buttons">
                        <a href="${d.dataUrl}" download="${d.namaFile}"><button class="btn-sm">⬇️ Unduh</button></a>
                        <button class="btn-sm btn-del" onclick="hapusDokumen(${d.idDoc})">🗑️ Hapus</button>
                    </div>
                </td>
            </tr>`
        ).join('');

        document.getElementById('statNasabah').innerText = nasabahList.length + ' Peserta';
        document.getElementById('statPiutang').innerText = formatRp(totalPiutang);
        document.getElementById('statKas').innerText = formatRp(kasTerkumpul);
        document.getElementById('statMacet').innerText = menunggakCount + ' Tagihan';
    }

    function eksporExcel() {
        if (nasabahList.length === 0) return alert("Belum ada data untuk ditarik!");
        let csv = "\uFEFFLAPORAN PEMBUKUAN CICILAN EMAS - PEMBELIASET.ID\nTanggal Cetak: " + new Date().toLocaleString('id-ID') + "\n\n";
        csv += "ID;Nama Peserta;Berat (Gram);Total Harga Emas;Uang Muka (DP);Tenor;Iuran Flat / Bulan;Sisa Tagihan;Progres Lunas\n";
        nasabahList.forEach(n => {
            let tenor = n.tenor || 12;
            let bulanLunas = n.jadwal.filter(j => j.status === 'Lunas').length;
            csv += `${n.id};"${n.nama}";${n.berat};${n.total};${n.dp};"${tenor} Bulan";${n.iuranFlat};${n.sisa};"${bulanLunas}/${tenor} Bulan"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `Laporan_Cicilan_Emas_Pembeliaset_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    window.onload = muatDataCloud;
</script>
